<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style>
      .monogram-main {
        font-family: 'Cinzel', 'Georgia', 'Times New Roman', serif;
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
      }
      .banner-sub {
        font-family: 'Montserrat', 'Arial', sans-serif;
        font-size: 24px;
        font-weight: 600;
        fill: #FFFFFF;
        letter-spacing: 0.32em;
        text-anchor: middle;
      }
    </style>
  </defs>

  <g transform="translate(260, 95)">
    <!-- Monogram Intertwined AAG Serif Graphic -->
    <text x="-65" y="15" font-size="105" class="monogram-main" opacity="0.95">A</text>
    <text x="0" y="0" font-size="130" class="monogram-main">A</text>
    <text x="65" y="15" font-size="105" class="monogram-main" opacity="0.95">G</text>

    <!-- Sleek Specular Underline Stroke -->
    <line x1="-220" y1="36" x2="220" y2="36" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

    <!-- Subtext Banner: AQIB ABDUL GHAFFAR -->
    <text x="0" y="68" class="banner-sub">AQIB ABDUL GHAFFAR</text>
  </g>
</svg>
